spring.application.name=python-lecture-backend

# Shared configuration. Production reads credentials from hosting environment variables.
# Use the local profile to load the private local.properties file.
# 8090, not 8080: 8080 is commonly taken by other Spring apps (e.g. NGCP) on dev machines
server.port=${PORT:8090}

# Database (override with env vars in every environment)
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# JPA properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway properties
spring.flyway.enabled=true
spring.flyway.locations=classpath:migration

# Never leak stack traces or exception messages to clients
server.error.include-stacktrace=never
server.error.include-message=never

# JWT: JWT_SECRET must be a Base64 string of at least 32 random bytes (openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=python-lecture
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=14d

# Refresh-token cookie. Keep secure=true everywhere except plain-http localhost.
app.cookie.secure=${COOKIE_SECURE:true}

# Brute-force protection
app.login.max-failed-attempts=5
app.login.lock-duration=15m
app.rate-limit.auth-requests-per-minute=20

# Origins allowed to call the API from another host (comma separated). Empty = same origin only.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Optional first teacher account, created on startup when both are set and the email is free.
app.bootstrap-teacher.email=${TEACHER_EMAIL:}
app.bootstrap-teacher.password=${TEACHER_PASSWORD:}
app.bootstrap-teacher.display-name=${TEACHER_NAME:Teacher}
